<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b24">
  <title>Aurora voyage image</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="voyage-card.css?v=20260922-2">
  <link rel="stylesheet" href="i18n.css?v=20260922-1">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
  <script src="i18n.js?v=20260923-1" defer></script>
  <script src="voyage-card.js?v=20260922-5" defer></script>
</head>
<body>
  <header class="export-toolbar" aria-label="Voyage image controls">
    <a class="back-link" href="index.html#voyages">← Voyage archive</a>

    <label>Passage
      <select data-track-select aria-label="Passage"></select>
    </label>

    <div class="control-cluster">
      <span class="control-label">Scope</span>
      <div class="scope-options" role="group" aria-label="Export scope">
        <button type="button" data-scope="leg" aria-pressed="true">Passage</button>
        <button type="button" data-scope="range" aria-pressed="false">Range</button>
        <button type="button" data-scope="voyage" aria-pressed="false">Whole voyage</button>
      </div>
    </div>

    <div class="range-controls" data-range-controls hidden>
      <label>From
        <select data-range-start aria-label="First passage in export range"></select>
      </label>
      <label>To
        <select data-range-end aria-label="Last passage in export range"></select>
      </label>
    </div>

    <div class="control-cluster">
      <span class="control-label">Image format</span>
      <div class="layout-options" role="group" aria-label="Image format">
        <button type="button" data-layout="story" aria-pressed="true">1080 × 1920 · Story</button>
        <button type="button" data-layout="portrait" aria-pressed="false">1080 × 1350 · Portrait</button>
        <button type="button" data-layout="article" aria-pressed="false">1600 × 1000 · Article</button>
        <button type="button" data-layout="wide" aria-pressed="false">1920 × 1080 · Wide</button>
        <button type="button" data-layout="wide-context" aria-pressed="false">1920 × 1080 · Wide + context</button>
      </div>
    </div>

    <button class="download-button" type="button" data-download disabled>Download PNG</button>
  </header>

  <main>
    <section class="voyage-card" data-card data-card-layout="story" aria-label="Aurora voyage image preview">
      <header class="card-heading">
        <p>S/Y AURORA · GREAT DANE 28 · HULL 165</p>
        <h1 data-card-title>Voyage archive</h1>
        <div data-card-meta>Waiting for GPX data</div>
      </header>
      <div class="card-map-stage" data-map-stage>
        <section class="card-map-panel card-map-panel-context" aria-label="Voyage context map">
          <div class="card-map-caption">Voyage to current stop</div>
          <div id="voyage-context-map" class="card-map"></div>
        </section>
        <section class="card-map-panel card-map-panel-detail" aria-label="Selected Aurora passage map">
          <div class="card-map-caption" data-detail-caption>Current passage</div>
          <div id="voyage-card-map" class="card-map"></div>
        </section>
      </div>
      <footer class="card-footer">
        <span>AURORA VOYAGE ATLAS</span>
        <span data-card-voyage>Recorded passage</span>
      </footer>
    </section>
    <p class="export-status" data-status aria-live="polite"></p>
  </main>
</body>
</html>
